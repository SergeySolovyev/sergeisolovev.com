    <script type="module">
      import React, { useEffect, useMemo, useRef } from "react";
      import { createRoot } from "react-dom/client";
      import * as THREE from "three";
      import gsap from "gsap";
      import ScrollTrigger from "gsap/ScrollTrigger";
      import Lenis from "@studio-freight/lenis";

      gsap.registerPlugin(ScrollTrigger);

      function useLenis() {
        useEffect(() => {
          const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          if (reduced) return;

          const lenis = new Lenis({
            duration: 1.05,
            smoothWheel: true,
            smoothTouch: false,
          });

          let raf = 0;
          const loop = (time) => {
            lenis.raf(time);
            raf = requestAnimationFrame(loop);
          };

          raf = requestAnimationFrame(loop);
          lenis.on("scroll", ScrollTrigger.update);
          gsap.ticker.lagSmoothing(0);

          return () => {
            cancelAnimationFrame(raf);
            lenis.destroy();
          };
        }, []);
      }

      function useReveal() {
        useEffect(() => {
          const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          if (reduced) {
            document.querySelectorAll(".reveal").forEach((el) => {
              el.style.opacity = 1;
              el.style.transform = "none";
            });
            return;
          }

          const ctx = gsap.context(() => {
            gsap.utils.toArray(".reveal").forEach((el, i) => {
              gsap.to(el, {
                opacity: 1,
                y: 0,
                duration: 0.8,
                delay: i * 0.02,
                ease: "power3.out",
                scrollTrigger: {
                  trigger: el,
                  start: "top 88%",
                },
              });
            });
          });

          return () => {
            ctx.revert();
            ScrollTrigger.getAll().forEach((t) => t.kill());
          };
        }, []);
      }

      function ThreeSeparator({ type }) {
        const mountRef = useRef(null);

        useEffect(() => {
          const host = mountRef.current;
          if (!host) return;

          const scene = new THREE.Scene();
          scene.background = new THREE.Color("#ece9e2");

          const camera = new THREE.PerspectiveCamera(54, 1, 0.1, 60);
          camera.position.set(0, 1.55, 4.6);
          camera.lookAt(0, 0.25, 0);

          const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
          renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.8));
          renderer.outputColorSpace = THREE.SRGBColorSpace;
          renderer.setClearAlpha(0);
          host.appendChild(renderer.domElement);

          const ambient = new THREE.AmbientLight(0xffffff, 0.78);
          const lightA = new THREE.DirectionalLight(0x64748b, 1.15);
          lightA.position.set(2, 3, 2);
          const lightB = new THREE.DirectionalLight(0xb38a5a, 0.7);
          lightB.position.set(-2, 2, -1);
          scene.add(ambient, lightA, lightB);

          const group = new THREE.Group();
          group.position.y = type === "descent" ? 0.52 : type === "chain" ? 0.46 : 0.4;
          scene.add(group);

          const mouse = new THREE.Vector2(0, 0);
          const pointer = new THREE.Vector3(0, 0, 0);
          const raycaster = new THREE.Raycaster();
          const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
          const target = new THREE.Vector3();
          const soft = new THREE.Vector3();
          let active = false;
          let isVisible = true;

          const disposables = [];
          let morphState = null;
          let nodes = [];
          let aiOrbit = null;

          if (type === "descent") {
            const geom = new THREE.PlaneGeometry(6.2, 4.9, 92, 72);
            const pos = geom.attributes.position;
            const base = new Float32Array(pos.count);

            for (let i = 0; i < pos.count; i++) {
              const x = pos.getX(i);
              const y = pos.getY(i);
              const z = 0.25 * Math.sin(x * 1.6) + 0.18 * Math.cos(y * 2.2);
              pos.setZ(i, z);
              base[i] = z;
            }

            geom.computeVertexNormals();
            morphState = { geom, pos, base };

            const mat = new THREE.MeshStandardMaterial({
              color: 0x64748b,
              wireframe: true,
              roughness: 0.38,
              metalness: 0.1,
              transparent: true,
              opacity: 0.92,
            });
            const mesh = new THREE.Mesh(geom, mat);
            mesh.rotation.x = -Math.PI / 2.2;
            group.add(mesh);
            disposables.push(geom, mat);

            const orbGeom = new THREE.SphereGeometry(0.11, 26, 26);
            const orbMat = new THREE.MeshStandardMaterial({ color: 0xb38a5a, emissive: 0x78350f, emissiveIntensity: 0.2 });
            const orb = new THREE.Mesh(orbGeom, orbMat);
            orb.position.set(-1.7, 0.35, 0.2);
            group.add(orb);
            nodes = [orb];
            disposables.push(orbGeom, orbMat);
          }

          if (type === "chain") {
            const nodeGeom = new THREE.SphereGeometry(0.08, 16, 16);
            const nodeMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.33, metalness: 0.08 });
            disposables.push(nodeGeom, nodeMat);

            const pts = [];
            for (let i = 0; i < 34; i++) {
              const p = new THREE.Vector3((Math.random() - 0.5) * 3.2, (Math.random() - 0.5) * 1.8, (Math.random() - 0.5) * 2.6);
              pts.push(p);
              const n = new THREE.Mesh(nodeGeom, nodeMat);
              n.position.copy(p);
              n.userData.base = p.clone();
              group.add(n);
              nodes.push(n);
            }

            const lineMat = new THREE.LineBasicMaterial({ color: 0x94a3b8, transparent: true, opacity: 0.42 });
            disposables.push(lineMat);
            for (let i = 0; i < pts.length; i++) {
              const links = [7, 13].map((offset) => pts[(i + offset) % pts.length]);
              links.forEach((p2) => {
                const g = new THREE.BufferGeometry().setFromPoints([pts[i], p2]);
                const line = new THREE.Line(g, lineMat);
                group.add(line);
                disposables.push(g);
              });
            }
          }

          if (type === "ai") {
            const coreGeom = new THREE.IcosahedronGeometry(0.36, 1);
            const coreMat = new THREE.MeshStandardMaterial({
              color: 0x334155,
              roughness: 0.22,
              metalness: 0.35,
              emissive: 0x0f172a,
              emissiveIntensity: 0.08,
            });
            const core = new THREE.Mesh(coreGeom, coreMat);
            group.add(core);

            const shellGeom = new THREE.IcosahedronGeometry(0.78, 0);
            const shellMat = new THREE.MeshBasicMaterial({ color: 0x94a3b8, wireframe: true, transparent: true, opacity: 0.42 });
            const shell = new THREE.Mesh(shellGeom, shellMat);
            group.add(shell);

            const blockGeom = new THREE.BoxGeometry(0.2, 0.2, 0.2);
            const blockMat = new THREE.MeshStandardMaterial({ color: 0xb38a5a, roughness: 0.28, metalness: 0.22 });
            const blocks = [];

            for (let i = 0; i < 14; i++) {
              const angle = (i / 14) * Math.PI * 2;
              const block = new THREE.Mesh(blockGeom, blockMat);
              block.position.set(Math.cos(angle) * 1.65, Math.sin(i * 0.7) * 0.18, Math.sin(angle) * 1.18);
              block.rotation.set(0.4 + i * 0.05, angle, 0.2);
              block.userData.phase = i * 0.45;
              block.userData.baseY = block.position.y;
              group.add(block);
              blocks.push(block);
            }

            const linkMat = new THREE.LineBasicMaterial({ color: 0x64748b, transparent: true, opacity: 0.54 });
            const links = [];
            for (let i = 0; i < blocks.length; i++) {
              const from = i;
              const to = (i + 1) % blocks.length;
              const geom = new THREE.BufferGeometry();
              geom.setAttribute("position", new THREE.BufferAttribute(new Float32Array(6), 3));
              const line = new THREE.Line(geom, linkMat);
              group.add(line);
              links.push({ line, from, to });
              disposables.push(geom);
            }

            const nodeGeom = new THREE.SphereGeometry(0.045, 12, 12);
            const nodeMat = new THREE.MeshStandardMaterial({ color: 0x9ca3af, roughness: 0.3, metalness: 0.12 });
            const satellites = [];
            for (let i = 0; i < 18; i++) {
              const sat = new THREE.Mesh(nodeGeom, nodeMat);
              sat.userData.angle = (i / 18) * Math.PI * 2;
              sat.userData.radius = 1.0 + (i % 4) * 0.14;
              sat.userData.height = (i % 5 - 2) * 0.09;
              sat.userData.speed = 0.45 + (i % 6) * 0.06;
              group.add(sat);
              satellites.push(sat);
            }

            aiOrbit = { core, shell, blocks, links, satellites };
            disposables.push(coreGeom, coreMat, shellGeom, shellMat, blockGeom, blockMat, linkMat, nodeGeom, nodeMat);
          }

          const resize = () => {
            const w = host.clientWidth;
            const h = host.clientHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h, false);
          };

          resize();
          window.addEventListener("resize", resize);

          const onMove = (e) => {
            const rect = host.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width;
            const y = (e.clientY - rect.top) / rect.height;
            mouse.set(x * 2 - 1, -(y * 2 - 1));
            active = true;
          };

          const onLeave = () => {
            active = false;
          };

          host.addEventListener("pointermove", onMove, { passive: true });
          host.addEventListener("pointerleave", onLeave, { passive: true });

          const io = new IntersectionObserver((entries) => {
            entries.forEach((entry) => {
              isVisible = entry.isIntersecting;
            });
          }, { threshold: 0.1 });
          io.observe(host);

          let raf = 0;
          let t = 0;

          const animate = () => {
            t += 0.013;

            raycaster.setFromCamera(mouse, camera);
            raycaster.ray.intersectPlane(plane, target);
            if (active && isVisible) {
              soft.lerp(target, 0.08);
            } else {
              soft.lerp(new THREE.Vector3(0, 0, 0), 0.045);
            }

            group.rotation.y += type === "chain" ? 0.003 : 0.0018;
            group.rotation.x = Math.sin(t * 0.37) * 0.07;

            if (morphState) {
              const { pos, base } = morphState;
              for (let i = 0; i < pos.count; i++) {
                const vx = pos.getX(i);
                const vy = pos.getY(i);
                const dist = Math.hypot(vx - soft.x, vy - soft.z);
                const influence = Math.max(0, 1 - dist / 2.1);
                const wobble = Math.sin(t * 2.7 + vx * 1.5 + vy * 1.2) * 0.012;
                const targetZ = base[i] + influence * 0.24 + wobble;
                pos.setZ(i, pos.getZ(i) + (targetZ - pos.getZ(i)) * 0.1);
              }
              pos.needsUpdate = true;
              morphState.geom.computeVertexNormals();

              if (nodes[0]) {
                nodes[0].position.x = Math.sin(t * 1.15) * 1.7 + soft.x * 0.22;
                nodes[0].position.z = Math.cos(t * 1.05) * 1.38 + soft.z * 0.2;
                nodes[0].position.y = 0.24 + Math.sin(t * 2.4) * 0.08;
              }
            }

            if (nodes.length > 1) {
              nodes.forEach((node, i) => {
                const base = node.userData.base;
                const dir = base.clone().sub(soft);
                const dist = Math.max(dir.length(), 0.001);
                const power = Math.max(0, 1 - dist / 2.4);
                const pull = dir.normalize().multiplyScalar(power * 0.07);

                const toMouse = soft.clone().sub(node.position);
                const mouseDist = Math.max(toMouse.length(), 0.001);
                const mousePower = Math.max(0, 1 - mouseDist / 2.2);
                const mouseLift = toMouse.normalize().multiplyScalar(mousePower * 0.2);

                node.position.x += (base.x + pull.x + mouseLift.x + Math.sin(t + i * 0.25) * 0.01 - node.position.x) * 0.11;
                node.position.y += (base.y + mouseLift.y * 0.4 + Math.cos(t * 1.1 + i * 0.31) * 0.02 - node.position.y) * 0.1;
                node.position.z += (base.z + pull.z + mouseLift.z - node.position.z) * 0.11;
              });
            }

            if (aiOrbit) {
              aiOrbit.core.rotation.x += 0.008;
              aiOrbit.core.rotation.y += 0.01;

              aiOrbit.shell.rotation.y -= 0.006;
              aiOrbit.shell.rotation.x += 0.002;

              aiOrbit.blocks.forEach((block, i) => {
                block.position.y = block.userData.baseY + Math.sin(t * 1.7 + block.userData.phase) * 0.07;
                block.rotation.y += 0.006;
                block.rotation.x += 0.002;
              });

              aiOrbit.links.forEach(({ line, from, to }) => {
                const p1 = aiOrbit.blocks[from].position;
                const p2 = aiOrbit.blocks[to].position;
                const attr = line.geometry.attributes.position;
                attr.setXYZ(0, p1.x, p1.y, p1.z);
                attr.setXYZ(1, p2.x, p2.y, p2.z);
                attr.needsUpdate = true;
              });

              aiOrbit.satellites.forEach((sat, i) => {
                const a = sat.userData.angle + t * sat.userData.speed;
                const wobble = Math.sin(t * 1.8 + i * 0.5) * 0.08;
                sat.position.x = Math.cos(a) * (sat.userData.radius + wobble) + soft.x * 0.1;
                sat.position.z = Math.sin(a) * (sat.userData.radius + wobble) + soft.z * 0.1;
                sat.position.y = sat.userData.height + Math.cos(t * 1.4 + i * 0.35) * 0.07;
              });
            }

            renderer.render(scene, camera);
            raf = requestAnimationFrame(animate);
          };

          raf = requestAnimationFrame(animate);

          return () => {
            cancelAnimationFrame(raf);
            io.disconnect();
            host.removeEventListener("pointermove", onMove);
            host.removeEventListener("pointerleave", onLeave);
            window.removeEventListener("resize", resize);
            disposables.forEach((d) => {
              if (d && typeof d.dispose === "function") d.dispose();
            });
            renderer.dispose();
            if (renderer.domElement.parentNode === host) host.removeChild(renderer.domElement);
          };
        }, [type]);

        return React.createElement("div", { className: "scene-shell", ref: mountRef });
      }

      function App() {
        useLenis();
        useReveal();

        const transition = useMemo(
          () => [
            {
              era: "2006 — Present",
              title: "TradFi",
              text: "Portfolio management >$4B, multi-asset trading, risk models (VaR, GARCH), treasury operations. Bloomberg BQNT quantitative tools.",
            },
            {
              era: "2024 — Research",
              title: "AI / ML",
              text: "Three MSc programs in AI, CV, and Financial Engineering. Document AI, time-series forecasting, smart-contract vulnerability detection via ML.",
            },
            {
              era: "Frontier",
              title: "DeFi",
              text: "Full DeFi lifecycle: mining → wrapping → liquidity (Uniswap, Aave, Curve). Smart-contract architecture, tokenomics, Solidity. ML-based security.",
            },
          ],
          []
        );

        const timeline = useMemo(
          () => [
            {
              date: "FEB 2026 — PRESENT",
              role: "Advisor to the President",
              org: "Mosoblbank (PSB Group)",
              text: "Leading AI transformation: roadmap, use-case prioritization, pilot launches. Supervising Treasury and Financial Markets Operations.",
              tags: ["AI Strategy", "Banking", "Transformation"],
