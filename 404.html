<!doctype html>
<html lang="en">
<head>

  <title>404 — Page not found | Sergei Solovev</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <style>
    :root{--bg:#f4f3ef;--text:#111827;--dim:#374151;--muted:#6b7280;--tradfi:#334155;--ai:#b38a5a;--defi:#1f2937;--card:rgba(255,255,255,.7);--stroke:rgba(15,23,42,.12)}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:"Manrope",system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.6}
    .wrap{max-width:760px;margin:0 auto;padding:48px 20px 64px}
    a{color:var(--tradfi)} a:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
    .brand{font-family:"Instrument Serif",serif;font-size:1.9rem;color:var(--defi);text-decoration:none}
    h1{font-family:"Instrument Serif",serif;font-size:2.6rem;line-height:1.05;margin:1.4rem 0 1rem}
    .eyebrow{font-family:"JetBrains Mono",monospace;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
    .links a{display:inline-block;margin:0 14px 8px 0;font-family:"JetBrains Mono",monospace;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em}
    .card{background:var(--card);border:1px solid var(--stroke);border-radius:18px;padding:22px 24px;margin:16px 0}
    footer{margin-top:40px;border-top:1px solid var(--stroke);padding-top:18px;font-family:"JetBrains Mono",monospace;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  </style>
</head>
<body>
  <div class="wrap">
    <a class="brand" href="/">Sergei Solovev</a>
    <div class="eyebrow" style="margin-top:28px">Error 404</div>

    <p>The link may be broken or the page moved. Try one of these:</p>
    <p class="links">
      <a href="/">Home</a><a href="/publications.html">Publications</a><a href="/blog/">Blog</a><a href="/news.html">News</a>
    </p>
    <footer>&copy; 2026 Sergei Solovev &middot; TradFi &rarr; AI &rarr; DeFi</footer>
